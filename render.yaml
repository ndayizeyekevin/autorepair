databases:
  - name: autorepair-db
    databaseName: autoservice
    user: autoservice
    plan: free
    region: frankfurt

services:
  - type: web
    name: autorepair-web
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autorepair-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: SEED_DEMO_USERS
        value: "false"
      - key: HTTPS_ONLY_COOKIE
        value: "true"
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
