services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoservice"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autoservice
      SECRET_KEY: docker-demo-secret-key-change-before-production
      PORT: "8000"
      SEED_DEMO_USERS: "true"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
