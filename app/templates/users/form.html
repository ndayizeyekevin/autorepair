{% extends "base.html" %}{% block title %}App User{% endblock %}{% block content %}
<section class="card"><h1>{{ 'Edit' if item else 'New' }} App User</h1>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username *<input name="username" required value="{{ item.username if item else '' }}"></label><label>{{ 'New password (leave blank to keep)' if item else 'Password *' }}<input type="password" name="password" {% if not item %}required{% endif %}></label><label>Role *<select name="role"><option value="user" {% if item and item.role=='user' %}selected{% endif %}>user</option><option value="admin" {% if item and item.role=='admin' %}selected{% endif %}>admin</option></select></label><button class="button">Save</button> <a class="button secondary" href="/users">Cancel</a></form></section>{% endblock %}
