{% extends "base.html" %}{% block title %}App Users{% endblock %}{% block content %}
<div class="toolbar"><h1>App Users</h1><a class="button" href="/users/new">Add user</a></div>
<div class="card"><table><thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Actions</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.userid }}</td><td>{{ r.username }}</td><td>{{ r.role }}</td><td class="actions"><a class="button secondary" href="/users/{{ r.userid }}/edit">Edit</a>{% if r.username not in ['admin','user'] %}<form class="inline" method="post" action="/users/{{ r.userid }}/delete" onsubmit="return confirm('Delete user?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Delete</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
