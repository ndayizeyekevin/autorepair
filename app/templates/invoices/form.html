{% extends "base.html" %}{% block title %}Invoice{% endblock %}{% block content %}
<section class="card"><h1>{{ 'Edit' if item else 'New' }} Invoice</h1>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<label>Date *<input type="datetime-local" name="invoicedate" required value="{{ item.invoicedate.strftime('%Y-%m-%dT%H:%M') if item else '' }}"></label>
<label>Total amount *<input type="number" step="0.01" min="0" name="totalamount" required value="{{ item.totalamount if item else proposed }}"></label>
<label class="full">Repair *<select name="repairid" required>{% for r in repairs %}<option value="{{ r.repairid }}" {% if item and item.repairid==r.repairid %}selected{% endif %}>#{{ r.repairid }} - {{ r.problemdescription or 'Repair' }}</option>{% endfor %}</select></label>
</div><button class="button">Save</button> <a class="button secondary" href="/invoices">Cancel</a></form></section>{% endblock %}
