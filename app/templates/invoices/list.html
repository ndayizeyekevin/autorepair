{% extends "base.html" %}{% block title %}Invoices{% endblock %}{% block content %}
<div class="toolbar"><h1>Invoices</h1><a class="button" href="/invoices/new">Add invoice</a></div>
<div class="card"><table><thead><tr><th>ID</th><th>Date</th><th>Total</th><th>Repair</th><th>Actions</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.invoiceid }}</td><td>{{ r.invoicedate }}</td><td>{{ r.totalamount }}</td><td>#{{ r.repairid }}</td><td class="actions"><a class="button secondary" href="/invoices/{{ r.invoiceid }}/edit">Edit</a>{% if user.role=='admin' %}<form class="inline" method="post" action="/invoices/{{ r.invoiceid }}/delete" onsubmit="return confirm('Delete invoice?')"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Delete</button></form>{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
