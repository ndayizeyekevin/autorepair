{% extends "base.html" %}{% block title %}Repair{% endblock %}{% block content %}
<section class="card"><h1>{{ 'Edit' if item else 'New' }} Repair</h1>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="form-grid">
<label>Date *<input type="datetime-local" name="repairdate" required value="{{ item.repairdate.strftime('%Y-%m-%dT%H:%M') if item else '' }}"></label>
<label>Cost<input type="number" step="0.01" min="0" name="cost" value="{{ item.cost if item else '' }}"></label>
<label class="full">Problem description<textarea name="problemdescription">{{ item.problemdescription if item else '' }}</textarea></label>
<label>Vehicle *<select name="vehicleid" required>{% for v in vehicles %}<option value="{{ v.vehicleid }}" {% if item and item.vehicleid==v.vehicleid %}selected{% endif %}>{{ v.platenumber }} - {{ v.brand }} {{ v.model }}</option>{% endfor %}</select></label>
<label>Mechanic *<select name="mechanicid" required>{% for m in mechanics %}<option value="{{ m.employeeid }}" {% if item and item.mechanicid==m.employeeid %}selected{% endif %}>{{ m.name }} - {{ m.specialty }}</option>{% endfor %}</select></label>
</div><button class="button">Save</button> <a class="button secondary" href="/repairs">Cancel</a></form></section>{% endblock %}
