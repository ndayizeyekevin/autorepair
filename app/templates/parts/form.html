{% extends "base.html" %}{% block title %}Spare Part{% endblock %}{% block content %}
<section class="card"><h1>{{ 'Edit' if item else 'New' }} Spare Part</h1>{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Part name *<input name="partname" required value="{{ item.partname if item else '' }}"></label><label>Price *<input type="number" step="0.01" min="0" name="price" required value="{{ item.price if item else '' }}"></label><label>Stock quantity *<input type="number" min="0" name="stockquantity" required value="{{ item.stockquantity if item else 0 }}"></label><button class="button">Save</button> <a class="button secondary" href="/parts">Cancel</a></form></section>{% endblock %}
